<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Eventia</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

<header>
    <a class="logo" href="index.html">EVENTIA</a>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="salones.html">Salones</a>
        <a href="reserva.html">Consultar disponibilidad</a>
        <a href="acceso.html">Ingresar</a>
    </nav>
</header>

<main>
    <h1>Ingresar o crear cuenta</h1>

    <p class="subtitulo">
        Accedé a Eventia para gestionar tu solicitud de reserva.
    </p>

    <div class="grid">

        <section class="panel formulario">
            <h2>Iniciar sesión</h2>

            <form action="../../../backend/login.php" method="post">

                <div class="campo">
                    <label for="email-login">Correo electrónico</label>
                    <input type="email" id="email-login" name="email" required>
                </div>

                <div class="campo">
                    <label for="pass-login">Contraseña</label>
                    <input type="password" id="pass-login" name="password" required>
                </div>

                <button type="submit">Ingresar</button>
            </form>
        </section>

        <section class="panel formulario">
            <h2>Crear cuenta de cliente</h2>

            <form action="../../../backend/registro.php" method="post">

                <div class="campo">
                    <label for="nombre">Nombre y Apellido</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="email-reg">Correo electrónico</label>
                    <input type="email" id="email-reg" name="email" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <div class="campo">
                    <label for="pass-reg">Contraseña</label>
                    <input type="password" id="pass-reg" name="password" required>
                </div>

                <button type="submit">Registrarme</button>
            </form>
        </section>

    </div>
</main>

<footer>
    <p>Eventia · Sistema de gestión de salones para eventos</p>
</footer>

<script>
document.querySelectorAll("form").forEach(form => {
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const datos = new FormData(form);

        try {
            const respuesta = await fetch(form.action, {
                method: "POST",
                body: datos
            });

            const texto = await respuesta.text();

            console.log("Respuesta de PHP:", texto);

            let resultado;

            try {
                resultado = JSON.parse(texto);
            } catch (error) {
                alert("Error de PHP: " + texto);
                return;
            }

            alert(resultado.mensaje);

            if (resultado.ok && resultado.redireccion) {
                window.location.href = resultado.redireccion;
            }

        } catch (error) {
            alert("No se pudo conectar con el servidor.");
            console.error(error);
        }
    });
});
</script>

</body>
</html>
